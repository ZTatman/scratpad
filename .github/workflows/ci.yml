name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck (app)
        run: pnpm run typecheck

      - name: Typecheck (server)
        run: pnpm run server:typecheck

      - name: Test
        run: pnpm test --runInBand

      - name: Expo export (iOS bundle validation)
        run: npx expo export --platform ios --output-dir dist/ios

      - name: Expo export (Android bundle validation)
        run: npx expo export --platform android --output-dir dist/android
